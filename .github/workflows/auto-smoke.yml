name: Update smoke snapshot (CA)

on:
  schedule:
    - cron: "40 * * * *" # AirNow usually publishes the prior hour's observations by :30.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: smoke-snapshot
  cancel-in-progress: false

jobs:
  fetch-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch AirNow once for all visitors
        env:
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
        run: npm run fetch:smoke
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/smoke_ca_latest.geojson
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): update CA smoke snapshot"
            if ! git push; then
              git pull --rebase origin "$GITHUB_REF_NAME"
              git push
            fi
          fi
